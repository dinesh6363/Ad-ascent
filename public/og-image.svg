<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b0d12"/><stop offset="1" stop-color="#0e1119"/>
    </linearGradient>
    <linearGradient id="brand" x1="80" y1="360" x2="720" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2a63f5"/><stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 90) rotate(120) scale(520)">
      <stop stop-color="#7c5cff" stop-opacity="0.45"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 120) rotate(60) scale(460)">
      <stop stop-color="#2a63f5" stop-opacity="0.4"/><stop offset="1" stop-color="#2a63f5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <text x="80" y="104" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5" fill="#e7e9ee">Ad<tspan fill="url(#brand)">-Ascent</tspan></text>

  <text x="80" y="250" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="3" fill="#7f9dff">MAKING TRUST VISIBLE</text>

  <text font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="800" letter-spacing="-1.5" fill="#e7e9ee">
    <tspan x="80" y="330">The trust you've earned offline</tspan>
    <tspan x="80" y="404">should be <tspan fill="url(#brand)">obvious online.</tspan></tspan>
  </text>

  <text x="80" y="474" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#9aa3b2">From the first Google search to the moment a customer chooses you.</text>

  <text x="80" y="560" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" fill="#6b7280">ad-ascent.com</text>
</svg>
